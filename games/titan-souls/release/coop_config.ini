; ============================================================================
; Titan Souls Co-op Mod Configuration (v1.2.0)
; ============================================================================

[General]
; QuickStart: 1 = Automatically loads Save Slot 0 (skips opening titles & menu)
QuickStart=1

; RunAutomatedTest: 0 = Normal player control (set to 1 to run automated motion suite)
RunAutomatedTest=0

; MidpointCamera: Frames the viewport dynamically between both players (shared screen / Host)
MidpointCamera=1

[Network]
; Enable Networked Multiplayer (1 = on, 0 = local shared-screen co-op only)
Enabled=1

; Transport protocol: "steam" (Steamworks P2P relay, default) or "udp" (Direct-IP / LAN)
Transport=steam

; Network Role: 1 = Host, 2 = Client
Role=1

; Direct-IP UDP settings (used when Transport=udp)
BindPort=7777
RemoteIP=127.0.0.1
RemotePort=7778

; Steamworks P2P target friend (leave 0 if hosting; on client, set friend's 64-bit Steam ID)
FriendSteamID=0

; Camera framing on Client (1 = independent camera centered on local player)
IndependentCamera=1

[Input]
; Gamepad Index for Player 2 (Local co-op)
GamepadIndex=1

; Enable secondary keyboard controls for Player 2 (Arrow Keys + J/K)
Keyboard2Enabled=1

[Player2]
; Player 2 tunic color tint (RGBA float format 0.0 to 1.0)
; Default: Cyan (0.2, 0.8, 1.0, 1.0)
ColorR=0.2
ColorG=0.8
ColorB=1.0
ColorA=1.0
