; Titan Souls Local & Networked Co-op Mod Configuration
; HOST INSTANCE

[General]
QuickStart=1
RunAutomatedTest=0
MidpointCamera=1

[Network]
; Enable UDP Networked Multiplayer
Enabled=1

; Role: 1 = Host (Server), 2 = Client (Joiner)
Role=1

; Local UDP port to bind
BindPort=7777

; Remote peer IP (for Client to connect to Host, or Host target)
RemoteIP=127.0.0.1

; Remote peer UDP port
RemotePort=7778

; Independent camera for network players (0 on host = midpoint camera)
IndependentCamera=0

[Input]
GamepadIndex=0
Keyboard2Enabled=0

[Player2]
; Cyan tint for Remote Client (Player 2)
ColorR=0.2
ColorG=0.8
ColorB=1.0
ColorA=1.0
