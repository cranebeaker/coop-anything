; Titan Souls Local & Networked Co-op Mod Configuration
; Default configuration uses Steamworks P2P relay networking (no port-forwarding required).
; To connect with a friend over Steam:
;   1. Set Transport=steam
;   2. Host sets Role=1, Client sets Role=2
;   3. Set FriendSteamID to your partner's 64-bit SteamID (or launch with -steamjoin <SteamID>)
;   4. Press F7 in-game to open the Steam Friends overlay
;
; Fallback: Set Transport=udp for direct LAN / Hamachi / Radmin VPN IP connection.

[General]
QuickStart=1
RunAutomatedTest=0
MidpointCamera=1

[Network]
; Enable Networked Multiplayer (1 = Enabled, 0 = Local Co-op only)
Enabled=1

; Transport protocol: "steam" (Steamworks P2P) or "udp" (direct socket)
Transport=steam

; Role: 1 = Host (Server), 2 = Client (Joiner)
Role=1

; Friend's 64-bit SteamID (used when Transport=steam)
; E.g. 76561198000000000 (leave 0 if joining via command-line +connect / -steamjoin)
FriendSteamID=0

; Local UDP port to bind (used when Transport=udp)
BindPort=7777

; Remote peer IP (used when Transport=udp)
RemoteIP=127.0.0.1

; Remote peer UDP port (used when Transport=udp)
RemotePort=7778

; Independent camera for network players (0 on host = midpoint camera, 1 on client = follow local player)
IndependentCamera=0

[Input]
GamepadIndex=0
Keyboard2Enabled=0

[Player2]
; Player 2 sprite tint (Cyan by default, Player 1 is unmodified white)
ColorR=0.2
ColorG=0.8
ColorB=1.0
ColorA=1.0
